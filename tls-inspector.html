<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLS Inspector</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c0f; --surface: #0f1318; --surface2: #161b22;
    --border: #21262d; --text: #e6edf3; --muted: #7d8590; --faint: #30363d;
    --green: #3fb950; --yellow: #d29922; --red: #f85149; --cyan: #58a6ff;
    --mono: 'JetBrains Mono', monospace; --sans: 'Syne', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.6; min-height: 100vh; padding: 2rem 1.5rem 4rem; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-family: var(--sans); font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; margin-bottom: 4px; }
  h1 span { color: var(--cyan); }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 2rem; }

  /* HOW TO BOX */
  .how { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem 1.5rem; margin-bottom: 2rem; }
  .how h3 { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
  .how ol { padding-left: 1.25rem; }
  .how li { font-size: 13px; color: var(--muted); margin-bottom: 0.4rem; line-height: 1.6; }
  .how code { background: var(--faint); border-radius: 3px; padding: 1px 6px; color: var(--cyan); font-size: 12px; }

  /* PASTE AREA */
  #paste-box { width: 100%; min-height: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-family: var(--mono); font-size: 12px; color: var(--text); resize: vertical; outline: none; line-height: 1.6; }
  #paste-box:focus { border-color: var(--cyan); }
  #paste-box::placeholder { color: var(--faint); }
  .btn-row { display: flex; gap: 8px; margin: 0.75rem 0 2rem; flex-wrap: wrap; }
  #parse-btn { background: var(--cyan); color: var(--bg); border: none; border-radius: 6px; padding: 0.6rem 1.5rem; font-family: var(--sans); font-size: 13px; font-weight: 700; cursor: pointer; }
  #parse-btn:hover { opacity: 0.85; }
  #clear-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 1rem; font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
  #clear-btn:hover { border-color: var(--red); color: var(--red); }

  #status { font-size: 12px; margin-bottom: 1rem; min-height: 16px; }
  #status.err { color: var(--red); }

  /* RESULT PANELS */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; overflow: hidden; display: none; }
  .ph { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 0.6rem 1rem; font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .pb { padding: 1rem; }
  .dr { display: grid; grid-template-columns: 110px 1fr; gap: 8px; padding: 0.3rem 0; border-bottom: 1px solid var(--faint); }
  .dr:last-child { border-bottom: none; }
  .dk { color: var(--muted); font-size: 12px; }
  .dv { color: var(--text); font-size: 12px; word-break: break-all; }
  .cr { display: flex; gap: 10px; padding: 0.35rem 0; border-bottom: 1px solid var(--faint); font-size: 13px; align-items: flex-start; }
  .cr:last-child { border-bottom: none; }
  .ci { flex-shrink: 0; }
  .ok  { color: var(--green); }
  .wrn { color: var(--yellow); }
  .bad { color: var(--red); }
  #sum { display: none; margin-bottom: 1rem; }
  .sum-ok  { background: rgba(63,185,80,0.08); border: 1px solid rgba(63,185,80,0.3); border-radius: 8px; padding: 1rem 1.25rem; color: var(--green); font-family: var(--sans); font-weight: 700; font-size: 15px; }
  .sum-bad { background: rgba(248,81,73,0.08); border: 1px solid rgba(248,81,73,0.3); border-radius: 8px; padding: 1rem 1.25rem; }
  .sum-t   { font-family: var(--sans); font-weight: 700; color: var(--red); margin-bottom: 0.5rem; }
  .sum-i   { font-size: 13px; color: var(--red); padding: 0.15rem 0; }
  .sum-i::before { content: '• '; }
</style>
</head>
<body>
<div class="wrap">

  <h1>TLS <span>Inspector</span></h1>
  <p class="sub">Paste your <code style="background:var(--faint);border-radius:3px;padding:1px 6px;color:var(--cyan)">tls_inspector.py</code> output below to visualise the results.</p>

  <div class="how">
    <h3>How to use</h3>
    <ol>
      <li>Run: <code>python tls_inspector.py github.com</code></li>
      <li>Select all output in your terminal — <code>Ctrl+A</code> then <code>Ctrl+C</code></li>
      <li>Paste it below and click <strong>Render</strong></li>
    </ol>
  </div>

  <textarea id="paste-box" placeholder="Paste your tls_inspector.py output here…

TLS Certificate Inspector
Connecting to github.com:443 …
── Certificate details ─────────────────────────────
   Host        : github.com
   Subject     : CN=github.com
..."></textarea>

  <div class="btn-row">
    <button id="parse-btn">Render</button>
    <button id="clear-btn">Clear</button>
  </div>

  <div id="status"></div>

  <div class="panel" id="p-details">
    <div class="ph">📄 Certificate Details</div>
    <div class="pb" id="details-body"></div>
  </div>

  <div class="panel" id="p-checks">
    <div class="ph">🔍 Security Checks</div>
    <div class="pb" id="checks-body"></div>
  </div>

  <div id="sum"></div>

</div>
<script>
(function () {

  function setStatus(msg, cls) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = cls || '';
  }

  function dr(k, v) {
    return '<div class="dr"><span class="dk">' + k + '</span><span class="dv">' + v + '</span></div>';
  }

  function cr(icon, cls, msg) {
    return '<div class="cr"><span class="ci ' + cls + '">' + icon + ' </span><span>' + msg + '</span></div>';
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Strip ANSI colour codes from terminal output
  function stripAnsi(s) {
    return s.replace(/\x1B\[[0-9;]*m/g, '').replace(/\033\[[0-9;]*m/g, '');
  }

  function parseAndRender() {
    var raw = document.getElementById('paste-box').value;
    if (!raw.trim()) { setStatus('Paste some output first.', 'err'); return; }

    var text = stripAnsi(raw);
    var lines = text.split('\n').map(function(l){ return l.trim(); });

    // ── DETAILS ──
    function field(label) {
      // Match "Label   : value" style lines
      var re = new RegExp(label + '\\s*:\\s*(.+)', 'i');
      for (var i = 0; i < lines.length; i++) {
        var m = lines[i].match(re);
        if (m) return m[1].trim();
      }
      return null;
    }

    var host      = field('Host');
    var subject   = field('Subject');
    var issuer    = field('Issuer');
    var validFrom = field('Valid from');
    var expires   = field('Expires');
    var key       = field('Key');
    var signature = field('Signature');
    var protocol  = field('Protocol');
    var sans      = field('SANs');

    if (!host && !subject && !expires) {
      setStatus("Couldn't find certificate details — make sure you paste the full output.", 'err');
      return;
    }

    var dh = '';
    if (host)      dh += dr('Host',       esc(host));
    if (subject)   dh += dr('Subject',    esc(subject));
    if (issuer)    dh += dr('Issuer',     esc(issuer));
    if (validFrom) dh += dr('Valid from', esc(validFrom));
    if (expires)   dh += dr('Expires',    esc(expires));
    if (key)       dh += dr('Key',        esc(key));
    if (signature) dh += dr('Signature',  esc(signature));
    if (protocol)  dh += dr('Protocol',   esc(protocol));
    if (sans)      dh += dr('SANs',       esc(sans));
    document.getElementById('details-body').innerHTML = dh || '<span style="color:var(--muted)">No details found.</span>';

    // ── CHECKS ──
    var ch = '';
    var issues = [];

    // Find all check lines — ✔ ⚠ ✘
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      // Match lines starting with ✔ ⚠ ✘ (or their ASCII equivalents after ANSI strip)
      var isOk   = l.match(/^[✔✓]\s{1,3}(.+)/);
      var isWarn = l.match(/^[⚠!]\s{1,3}(.+)/);
      var isFail = l.match(/^[✘✗×]\s{1,3}(.+)/);

      if (isOk) {
        ch += cr('✔', 'ok', esc(isOk[1].trim()));
      } else if (isWarn) {
        ch += cr('⚠', 'wrn', esc(isWarn[1].trim()));
      } else if (isFail) {
        ch += cr('✘', 'bad', esc(isFail[1].trim()));
        issues.push(isFail[1].trim());
      }
    }

    if (!ch) {
      ch = '<span style="color:var(--muted)">No check results found in output.</span>';
    }
    document.getElementById('checks-body').innerHTML = ch;

    // ── SUMMARY ──
    // Also check for issues listed under ── Summary ──
    var inSummary = false;
    var summaryIssues = [];
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (l.indexOf('Summary') !== -1 && l.indexOf('──') !== -1) { inSummary = true; continue; }
      if (inSummary) {
        var m = l.match(/^[•\-]\s*(.+)/);
        if (m) summaryIssues.push(m[1].trim());
        // Check for "All checks passed"
        if (l.toLowerCase().indexOf('all checks passed') !== -1) {
          summaryIssues = [];
          break;
        }
      }
    }
    if (summaryIssues.length > 0) issues = summaryIssues;

    var sp = document.getElementById('sum');
    // Check if output contains "All checks passed"
    var allPassed = text.toLowerCase().indexOf('all checks passed') !== -1 && issues.length === 0;
    if (allPassed || (issues.length === 0 && ch && ch.indexOf('bad') === -1)) {
      sp.innerHTML = '<div class="sum-ok">✔ All checks passed. Certificate looks good.</div>';
    } else if (issues.length > 0) {
      var items = issues.map(function(i){return '<div class="sum-i">'+esc(i)+'</div>';}).join('');
      sp.innerHTML = '<div class="sum-bad"><div class="sum-t">✘ ' + issues.length + ' issue(s) found</div>' + items + '</div>';
    } else {
      sp.innerHTML = '<div class="sum-bad"><div class="sum-t">⚠ Issues detected — review checks above</div></div>';
    }

    document.getElementById('p-details').style.display = 'block';
    document.getElementById('p-checks').style.display = 'block';
    document.getElementById('sum').style.display = 'block';
    setStatus('');
  }

  function clearAll() {
    document.getElementById('paste-box').value = '';
    document.getElementById('p-details').style.display = 'none';
    document.getElementById('p-checks').style.display = 'none';
    document.getElementById('sum').style.display = 'none';
    setStatus('');
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('parse-btn').addEventListener('click', parseAndRender);
    document.getElementById('clear-btn').addEventListener('click', clearAll);
    document.getElementById('paste-box').addEventListener('keydown', function (e) {
      if (e.ctrlKey && e.key === 'Enter') parseAndRender();
    });
  });

}());
</script>
</body>
</html>
